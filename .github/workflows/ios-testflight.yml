name: Monsterdoku Production TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 1.0.1
        required: true
        type: string
      build_number:
        description: Optional positive iOS build number (defaults to the GitHub run number)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload production IPA
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      IOS_BUNDLE_ID: com.zemolabs.monsterdoku
      IOS_PROJECT_PATH: ${{ github.workspace }}/Build/ios
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate production release and committed Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            requested_build_number="${{ inputs.build_number }}"
          else
            version="${GITHUB_REF_NAME#v}"
            requested_build_number=""
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Production versions must be SemVer (for example, 1.2.3 or tag v1.2.3); got '$version'." >&2
            exit 1
          }
          build_number="${requested_build_number:-$GITHUB_RUN_NUMBER}"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]] || {
            echo "The iOS build number must be a positive integer; got '$build_number'." >&2
            exit 1
          }
          test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          test -f "$IOS_PROJECT_PATH/Info.plist"
          xcodebuild -version
          xcodebuild -list -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          command -v xcrun >/dev/null
          for secret_name in APPLE_TEAM_ID APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            test -n "${!secret_name}" || { echo "Missing required protected-environment secret: $secret_name" >&2; exit 1; }
          done
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj/project.pbxproj"
          printf 'IOS_MARKETING_VERSION=%s\nIOS_BUILD_NUMBER=%s\n' "$version" "$build_number" >> "$GITHUB_ENV"

      - name: Prepare the committed Xcode project for macOS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("Build/ios/Unity-iPhone.xcodeproj/project.pbxproj")
          source = project.read_text(encoding="utf-8")
          patched, replacements = re.subn(r'\s+--usymtool-path=\\".*?\\"', "", source)
          if replacements != 1:
              raise SystemExit(
                  f"Expected one Windows usymtool path in {project}, found {replacements}."
              )
          project.write_text(patched, encoding="utf-8")
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" "$IOS_PROJECT_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "$IOS_PROJECT_PATH/Info.plist"

      - name: Resolve CocoaPods dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$IOS_PROJECT_PATH/Podfile" ]]; then
            pod install --project-directory="$IOS_PROJECT_PATH" --repo-update
            test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace"
          fi

      - name: Archive and export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/Monsterdoku.xcarchive"
          export_path="$RUNNER_TEMP/export"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"

          if [[ -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" ]]; then
            container=( -workspace "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" )
          else
            container=( -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj" )
          fi

          xcodebuild archive \
            "${container[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            TARGETED_DEVICE_FAMILY="1,2"

          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string app-store "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$export_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          mkdir -p Builds/ipa
          cp "$ipa_path" Builds/ipa/Monsterdoku.ipa
          unzip -t Builds/ipa/Monsterdoku.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Monsterdoku-testflight-ipa-${{ github.run_number }}
          path: Builds/ipa/Monsterdoku.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload IPA to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$GITHUB_WORKSPACE/Builds/ipa/Monsterdoku.ipa" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
