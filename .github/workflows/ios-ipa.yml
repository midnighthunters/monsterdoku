name: Monsterdoku iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA distribution method
        required: true
        default: development
        type: choice
        options: [development, ad-hoc, app-store]
      version:
        description: Optional marketing version, for example 1.0.1
        required: false
        type: string
      build_number:
        description: Optional positive iOS build number (defaults to the GitHub run number)
        required: false
        type: string

permissions:
  contents: read

jobs:
  ipa:
    name: Archive and export IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      IOS_BUNDLE_ID: com.zemolabs.monsterdoku
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_MARKETING_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_PROJECT_PATH: ${{ github.workspace }}/Build/ios
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 26 toolchain (Swift 6.2)
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          test -n "$xcode_app" || { echo "No Xcode 26.x found on this runner image; the LevelPlay/IronSource SDK requires the Swift 6.2 runtime." >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          echo "Using $xcode_app"
          xcodebuild -version

      - name: Validate committed Xcode project and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          test -f "$IOS_PROJECT_PATH/Info.plist"
          xcodebuild -version
          xcodebuild -list -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj"
          for secret_name in APPLE_TEAM_ID APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            test -n "${!secret_name}" || { echo "Missing required secret: $secret_name" >&2; exit 1; }
          done
          if [[ -n "$IOS_BUILD_NUMBER" && ! "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "The iOS build number must be a positive integer; got '$IOS_BUILD_NUMBER'." >&2
            exit 1
          fi
          if [[ -n "$IOS_MARKETING_VERSION" && ! "$IOS_MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "The marketing version must contain only digits and dots; got '$IOS_MARKETING_VERSION'." >&2
            exit 1
          fi
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;" "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj/project.pbxproj"

      - name: Prepare the committed Xcode project for macOS
        shell: bash
        run: |
          set -euo pipefail
          build="${IOS_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path("Build/ios/Unity-iPhone.xcodeproj/project.pbxproj")
          source = project.read_text(encoding="utf-8")
          patched, replacements = re.subn(r'\s+--usymtool-path=\\".*?\\"', "", source)
          if replacements != 1:
              raise SystemExit(
                  f"Expected one Windows usymtool path in {project}, found {replacements}."
              )
          project.write_text(patched, encoding="utf-8")
          PY
          if [[ -n "$IOS_MARKETING_VERSION" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" "$IOS_PROJECT_PATH/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$IOS_PROJECT_PATH/Info.plist"

      - name: Resolve CocoaPods dependencies when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$IOS_PROJECT_PATH/Podfile" ]]; then
            pod install --project-directory="$IOS_PROJECT_PATH" --repo-update
            test -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace"
          fi

      - name: Archive and export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/Monsterdoku.xcarchive"
          export_path="$RUNNER_TEMP/export"
          build="${IOS_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"

          if [[ -d "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" ]]; then
            container=( -workspace "$IOS_PROJECT_PATH/Unity-iPhone.xcworkspace" )
          else
            container=( -project "$IOS_PROJECT_PATH/Unity-iPhone.xcodeproj" )
          fi

          xcodebuild archive \
            "${container[@]}" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$build" \
            TARGETED_DEVICE_FAMILY="1,2"

          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string "$IOS_EXPORT_METHOD" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

          echo "Exporting archive with method '$IOS_EXPORT_METHOD'..."
          mkdir -p "$export_path"
          if ! xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$export_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"; then
            echo "::warning::xcodebuild exportArchive failed with method '$IOS_EXPORT_METHOD'."
            if [[ "$IOS_EXPORT_METHOD" != "development" ]]; then
              echo "Attempting fallback export with method 'development'..."
              plutil -replace method -string development "$RUNNER_TEMP/ExportOptions.plist"
              xcodebuild -exportArchive \
                -archivePath "$archive_path" \
                -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                -exportPath "$export_path" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$key_path" \
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
                -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" || true
            fi
          fi

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [[ -z "$ipa_path" ]]; then
            echo "xcodebuild exportArchive did not produce an IPA; packaging directly from the signed archive..."
            app_dir="$(find "$archive_path/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit 2>/dev/null || true)"
            if [[ -z "$app_dir" ]]; then
              echo "Error: No .app bundle found in archive $archive_path/Products/Applications" >&2
              exit 1
            fi
            echo "Found application bundle: $app_dir"
            mkdir -p "$export_path/Payload"
            cp -R "$app_dir" "$export_path/Payload/"
            (cd "$export_path" && zip -r -q "Monsterdoku.ipa" Payload)
            rm -rf "$export_path/Payload"
            ipa_path="$export_path/Monsterdoku.ipa"
          fi

          test -f "$ipa_path" || { echo "Failed to find or produce an IPA" >&2; exit 1; }
          mkdir -p Builds/ipa
          cp "$ipa_path" Builds/ipa/Monsterdoku.ipa
          ls -lh Builds/ipa/Monsterdoku.ipa
          unzip -t Builds/ipa/Monsterdoku.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Monsterdoku-ipa-${{ inputs.build_number || github.run_number }}
          path: Builds/ipa/Monsterdoku.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
